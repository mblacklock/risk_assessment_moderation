{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Project moderation{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'moderation/app.css' %}">
  <script src="{% static 'moderation/app.js' %}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'moderation:index' %}"><span class="brand-mark" aria-hidden="true">m<span>·</span></span>Project moderation</a>
    <div class="topbar-meta"><span class="live-dot"></span> Local workspace <span class="divider">/</span> KB6060</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><span>Risk assessment & ethics · Completion review</span><span>Content adequacy and signature authenticity remain with the supervisor.</span></footer>
</body>
</html>
